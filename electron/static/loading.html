    .bar {
      position: relative;
      width: 160px;
      height: 3px;
      margin: 22px auto 0;
      border-radius: 3px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .bar::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 40%;
      border-radius: 3px;
      background: #4589a8;
      animation: slide 1.2s ease-in-out infinite;
    }
    /*
     * AI-style status line: the phrases take turns (CSS only: this page's CSP
     * allows no script), and a light sweeps across each one.
     */
    .status {
      position: relative;
      height: 1.4em;
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .status span {
      position: absolute;
      inset: 0;
      opacity: 0;
      white-space: nowrap;
      background: linear-gradient(90deg, #94a3b8 0%, #94a3b8 35%, #4589a8 50%, #94a3b8 65%, #94a3b8 100%);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      animation: phrase 12s infinite, shimmer 1.6s linear infinite;
    }
    .status span:nth-child(2) { animation-delay: 2s, 0s; }
    .status span:nth-child(3) { animation-delay: 4s, 0s; }
    .status span:nth-child(4) { animation-delay: 6s, 0s; }
    .status span:nth-child(5) { animation-delay: 8s, 0s; }
    .status span:nth-child(6) { animation-delay: 10s, 0s; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
    /* Each phrase owns 1/6 of the cycle: fade and rise in, hold, fade out. */
    @keyframes phrase {
      0% { opacity: 0; transform: translateY(6px); }
      2.5%, 14% { opacity: 1; transform: translateY(0); }
      16.66%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark, .word, .bar::after, .status span { animation: none; }
      .status span:first-child { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container" role="status" aria-label="Loading">
    <div class="mark"></div>
    <div class="word" aria-hidden="true"></div>
    <div class="bar"></div>
    <p class="status" aria-hidden="true">
      <span>Loading…</span>
      <span>Thinking…</span>
      <span>Waking up your workspace…</span>
      <span>Syncing your inbox…</span>
      <span>Lining up your calendar…</span>
      <span>Almost there…</span>
    </p>
  </div>
</body>
